# Cabeçalhos de segurança. Ficam num arquivo à parte porque `add_header` em um
# `location` SUBSTITUI o conjunto herdado do `server` — qualquer location que
# defina Cache-Control derrubaria o CSP sem avisar. Por isso este include é
# repetido em cada location que acrescenta cabeçalho.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
