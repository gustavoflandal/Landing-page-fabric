# A página é servida sob /fabric/ porque é assim que ela aparece no domínio: o
# proxy da frente encaminha com o prefixo inteiro (`handle /fabric*` e
# reverse_proxy SEM barra no final, no Caddy). Guardar os arquivos já em
# /fabric/ dentro do contêiner evita `alias` — que tem armadilhas com
# try_files — e faz os caminhos relativos do HTML resolverem sozinhos.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    # Quem termina o TLS é o proxy; aqui dentro a requisição chega em HTTP.
    # Sem isto o nginx monta o Location do 301 com o esquema que ele enxerga.
    absolute_redirect off;

    # Cabeçalhos de segurança. O CSP é restritivo de propósito: a página não
    # carrega nada de terceiros — as fontes Barlow são servidas junto com ela.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    # /fabric sem barra redireciona para a forma canônica.
    location = /fabric {
        return 301 /fabric/;
    }

    location = /fabric/ {
        try_files /fabric/index.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # Imagens e fontes não levam hash no nome, então o cache é moderado: uma
    # semana. Trocar um screenshot não deve exigir limpar o cache do cliente.
    location ~* ^/fabric/(img|fontes)/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location /fabric/ {
        try_files $uri $uri/ /fabric/index.html;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Sonda para o compose e para o proxy, sem depender do prefixo.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 404;
    }
}
